services:
  app:
    build: .
    container_name: cli_app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:securepassword@db:5432/cli_auth?sslmode=disable
    # Keep standard input open for the interactive CLI
    stdin_open: true
    tty: true

  db:
    image: postgres:15-alpine
    container_name: cli_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=cli_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: